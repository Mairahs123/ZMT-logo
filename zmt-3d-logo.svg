<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#fff4b0"/>
      <stop offset="0.24" stop-color="#f7d36b"/>
      <stop offset="0.52" stop-color="#d99a19"/>
      <stop offset="0.76" stop-color="#fff0a0"/>
      <stop offset="1" stop-color="#9b5c06"/>
    </linearGradient>

    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#9aa9bd"/>
      <stop offset="1" stop-color="#f8fbff"/>
    </linearGradient>

    <radialGradient id="navy" cx="45%" cy="30%" r="80%">
      <stop offset="0" stop-color="#123d72"/>
      <stop offset="0.62" stop-color="#071b3e"/>
      <stop offset="1" stop-color="#020916"/>
    </radialGradient>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="6" result="off"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.65"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer metallic gold coin -->
  <circle cx="256" cy="256" r="246"
          fill="#020713" stroke="url(#gold)" stroke-width="15"/>

  <circle cx="256" cy="256" r="226"
          fill="url(#navy)" stroke="url(#gold)" stroke-width="7"/>

  <circle cx="256" cy="256" r="211"
          fill="none" stroke="#f9d46d"
          stroke-opacity=".45" stroke-width="2"/>

  <!-- Modern skyline -->
  <path d="M125 222V142h39v80
           M173 222V111h46v111
           M293 222V127h45v95
           M348 222V158h38v64"
        fill="#10294d" stroke="url(#silver)"
        stroke-width="7" stroke-linejoin="round"/>

  <path d="M143 160h7v12h-7z
           M143 185h7v12h-7z
           M190 132h8v14h-8z
           M190 158h8v14h-8z
           M190 184h8v14h-8z
           M309 148h8v14h-8z
           M309 174h8v14h-8z
           M362 177h7v12h-7z"
        fill="url(#gold)"/>

  <!-- Golden house roof -->
  <path d="M91 250L256 112L421 250H385L256 143L127 250Z"
        fill="url(#gold)" stroke="#fff0ad"
        stroke-width="4" stroke-linejoin="round"
        filter="url(#shadow)"/>

  <!-- House body -->
  <path d="M202 229H310V310H202Z"
        fill="url(#gold)" stroke="#fff0ad" stroke-width="4"/>

  <path d="M222 248h19v19h-19z
           M275 248h19v19h-19z"
        fill="#071b3e"/>

  <path d="M245 277h22v33h-22z" fill="#071b3e"/>

  <!-- ZMT 3D lettering -->
  <text x="256" y="376"
        font-family="Arial, Helvetica, sans-serif"
        font-size="112" font-weight="900"
        text-anchor="middle" letter-spacing="-5"
        fill="#030b18" stroke="#030b18"
        stroke-width="15" paint-order="stroke">ZMT</text>

  <text x="256" y="368"
        font-family="Arial, Helvetica, sans-serif"
        font-size="112" font-weight="900"
        text-anchor="middle" letter-spacing="-5"
        fill="url(#gold)" stroke="#fff0a8"
        stroke-width="2" paint-order="stroke">ZMT</text>

  <!-- Metallic swoosh -->
  <path d="M104 398Q256 451 408 398"
        fill="none" stroke="url(#silver)"
        stroke-width="8" stroke-linecap="round"/>

  <path d="M124 407Q256 448 388 407"
        fill="none" stroke="url(#gold)"
        stroke-width="5" stroke-linecap="round"/>

  <!-- Project name -->
  <text x="256" y="448"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="27" font-weight="700"
        text-anchor="middle" letter-spacing="2.5"
        fill="url(#gold)">ZAMANI SHELTERS</text>
</svg>
